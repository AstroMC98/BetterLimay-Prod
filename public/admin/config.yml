# BetterLimay content editor.
#
# The editor writes directly into the repository's data files and commits on the
# editor's behalf, so nobody needs to touch git to post news. A commit still
# happens — that is deliberate, because it keeps the full edit history and means
# a bad post can be reverted like any other change.
#
# Fields here mirror src/data/schema/*.schema.json. If a schema changes, change
# this file in the same commit: `python -m pipeline.validate` runs in CI and will
# reject anything the editor writes that does not match.

backend:
  name: github
  repo: AstroMC98/BetterLimay-Prod
  branch: main
  # Our own OAuth proxy — api/admin-auth.ts. The browser cannot complete the
  # token exchange itself because that step needs the client secret.
  #
  # Three things must name the same origin or sign-in fails:
  #   1. the domain the editor is served from
  #   2. this base_url
  #   3. the GitHub OAuth app's Authorization callback URL
  # Change them together, never one at a time.
  # The apex betterlimay.org redirects to www, so www is the one real origin.
  base_url: https://www.betterlimay.org
  auth_endpoint: api/admin-auth

# Posts land on a branch and open a pull request rather than committing straight
# to main. Publishing is still one click, but a mistake is caught before it is
# live and every change is reviewable.
publish_mode: editorial_workflow

locale: en

media_folder: public/uploads
public_folder: /uploads

collections:
  - name: announcements
    label: News and announcements
    label_singular: Announcement
    description: >
      News posted by the Municipality. Write the post here, or link to an
      official post elsewhere, or both. Open a post to edit it; use the Delete
      button inside a post to remove it.
    folder: src/data/announcements
    create: true
    delete: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{publishedAt | date('YYYY-MM-DD')}} — {{title}}"
    sortable_fields: [publishedAt, title]
    # One JSON file per post; a build step folds them into announcements.json.
    extension: json
    format: json
    fields:
      - {
          name: id,
          label: ID,
          widget: string,
          hint: "Lowercase letters, numbers and hyphens, e.g. 2026-09-25-road-closure",
          pattern: ["^[a-z0-9-]+$", "Lowercase letters, numbers and hyphens only"],
        }
      - { name: title, label: Title, widget: string }
      - {
          name: publishedAt,
          label: Published,
          widget: datetime,
          format: "YYYY-MM-DDTHH:mm:ssZ",
        }
      - {
          name: summary,
          label: Summary,
          widget: text,
          required: false,
          hint: "One or two sentences shown on the news list.",
        }
      - {
          name: image,
          label: Cover image,
          widget: image,
          required: false,
          choose_url: false,
        }
      - {
          name: imageAlt,
          label: Image description,
          widget: string,
          required: false,
          hint: "What the image shows, for readers using a screen reader. Required if you add an image.",
        }
      - name: body
        label: Post
        widget: markdown
        required: false
        buttons:
          [
            bold,
            italic,
            link,
            heading-two,
            heading-three,
            bulleted-list,
            numbered-list,
            quote,
          ]
        editor_components: [image]
        modes: [rich_text, raw]
      - name: facebookUrl
        label: Facebook post or live video
        widget: string
        required: false
        hint: "Optional. Paste a link to a post or live video on the Municipality's Facebook page; readers can play it here."
        pattern:
          [
            '^https://(www\.|m\.)?facebook\.com/|^https://fb\.watch/',
            "Must be a facebook.com or fb.watch link",
          ]
      - {
          name: url,
          label: Original post URL,
          widget: string,
          required: false,
          hint: "Optional. Link to the post on the official website or Facebook page.",
          pattern: ["^https://", "Must be a full https:// link"],
        }
      - {
          name: sourceName,
          label: Posted by,
          widget: string,
          default: "Municipality of Limay",
        }
      - name: provenance
        label: Source
        widget: object
        collapsed: true
        fields:
          - {
              name: source_document,
              label: Source,
              widget: string,
              default: "Posted by the Municipality of Limay on BetterLimay",
            }
          - {
              name: source_url,
              label: Source URL,
              widget: string,
              required: false,
              pattern: ["^https://", "Must be a full https:// link"],
            }
          - {
              name: source_name,
              label: Publisher,
              widget: string,
              default: "Municipality of Limay",
            }
          - {
              name: retrieved_at,
              label: Date,
              widget: datetime,
              format: "YYYY-MM-DD",
              date_format: "YYYY-MM-DD",
              time_format: false,
            }
          - { name: verified, label: Verified, widget: hidden, default: true }

  - name: hotlines
    label: Emergency hotlines
    label_singular: Hotline
    description: >
      Numbers a resident may dial in an emergency. Of everything here this is the
      one where being wrong causes direct harm — check each number against the
      official source before saving.
    file_collections: false
    folder: src/data/hotlines
    create: true
    extension: json
    format: json
    slug: "{{slug}}"
    fields:
      - {
          name: id,
          label: ID,
          widget: string,
          pattern: ["^[a-z0-9-]+$", "Lowercase letters, numbers and hyphens only"],
        }
      - { name: service, label: Service or office, widget: string }
      - { name: agency, label: Agency, widget: string, required: false }
      - name: numbers
        label: Numbers
        widget: list
        field: { name: number, label: Number, widget: string }
        hint: Enter each number exactly as published. Do not reformat it.
      - name: category
        label: Category
        widget: select
        options: [police, fire, medical, disaster, coastguard, utility, other]
      - name: provenance
        label: Provenance
        widget: object
        fields:
          - {
              name: source_document,
              label: Source document,
              widget: string,
              default: "Municipality of Limay emergency hotlines poster",
            }
          - {
              name: source_name,
              label: Publisher,
              widget: string,
              default: "Municipality of Limay",
            }
          - {
              name: retrieved_at,
              label: Retrieved,
              widget: datetime,
              format: "YYYY-MM-DD",
              date_format: "YYYY-MM-DD",
              time_format: false,
            }
          - { name: verified, label: Verified, widget: hidden, default: true }
          - { name: verification_note, label: Note, widget: string, required: false }

  - name: facebook-pages
    label: Official Facebook pages
    label_singular: Facebook page
    description: >
      Pages shown as tabs in the "Latest from Limay" feed on the home page, in
      the order given. Only official pages of the Municipality, its offices and
      public agencies serving Limay.
    folder: src/data/facebook-pages
    create: true
    delete: true
    extension: json
    format: json
    slug: "{{id}}"
    summary: "{{order}}. {{name}}"
    sortable_fields: [order, name]
    fields:
      - { name: id, label: ID, widget: string, hint: "Lowercase, starting with fb-, e.g. fb-limay-mdrrmo", pattern: ['^[a-z0-9-]+$', "Lowercase letters, numbers and hyphens only"] }
      - { name: name, label: Page name, widget: string }
      - { name: url, label: Facebook address, widget: string, hint: "The page's address, e.g. https://www.facebook.com/limay.cc", pattern: ['^https://www\.facebook\.com/', "Must start with https://www.facebook.com/"] }
      - { name: description, label: One-line description, widget: string, required: false }
      - { name: order, label: Tab order, widget: number, value_type: int, min: 1, default: 9 }
      - name: provenance
        label: Source
        widget: object
        collapsed: true
        fields:
          - { name: source_url, label: Page URL, widget: string }
          - { name: source_name, label: Page name, widget: string }
          - { name: retrieved_at, label: Date added, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
          - { name: verified, label: Verified, widget: hidden, default: true }

