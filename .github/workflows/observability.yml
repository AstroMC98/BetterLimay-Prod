name: Scheduled observability

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freshness-and-health:
    name: Freshness and deployment health
    runs-on: ubuntu-latest
    env:
      DATA_FRESHNESS_MAX_DAYS: "180"
      PORTAL_HEALTHCHECK_URL: ${{ vars.PORTAL_HEALTHCHECK_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies
        run: python -m pip install --requirement pipeline/requirements.txt

      - name: Run freshness and deployment health check
        run: npm run check:observability

      - name: Validate configuration and data schemas
        run: python -m pipeline.validate
