  - id: orion-citizens-charter-2026
    path: municipality-of-orion/citizens-charter-2026-1st-edition.pdf
    entity: Municipality of Orion
    entity_scope: peer-lgu
    source_name: Municipality of Orion
    url: null
    # No public URL yet, so this cannot flow through the stage 2-4 document
