# BetterLimay acquired-source register.
#
# This is the ONLY hand-edited metadata file in sources/. `sources/manifest.json`
# is generated from it by `pipeline/0_acquire.py`; never hand-edit the manifest.
#
# Contract (see sources/README.md):
#   - `url` must be an exact, public, auditable URL, or null with `blocked_by`.
#     A null url is emitted with a non-fetched status, which pipeline/2_normalize.py
#     skips automatically. This is the governance gate, enforced mechanically.
#   - `retrieved_at` is date-only (YYYY-MM-DD) to match provenance.schema.json.
#   - Two entries must never share a `url`: pipeline/2_normalize.py derives document
#     identity from sha256(url)[:12], so a collision silently overwrites extracted text.
#
# entity_scope: municipal | peer-lgu | provincial | gocc | national-agency
# extraction:   none | tabular | llm-text | llm-vision
#   The llm-text/llm-vision split records whether the PDF has a text layer, which
#   is useful to know, but it does not change how stage 5 runs: Gemini reads PDFs
#   with native vision and handles a scan and a digital document identically.
# completeness: complete | truncated | partial | unknown

version: 1

