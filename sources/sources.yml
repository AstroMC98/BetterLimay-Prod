    bridge_blocked_by: [exact-url-unconfirmed]
    retrieved_at: 2026-09-23
    document:
      title: "Municipality of Orion Citizen's Charter, 2026 1st Edition"
    acquisition: manual-download
    extraction: llm-vision
    extraction_scope: government-to-citizen
    completeness: complete
    target_datasets: [services.json]
    gap_ids: [GAP-009]
    display_as: reference
    publishable: true
    notes: >
      381 pages, 37.8 MB. SCANNED: zero selectable characters across all 381 pages;
      every page is a single DCTDecode (JPEG) image.
      Consequences:
        - pipeline/3_parse.py extracts nothing. Its OCR fallback needs Tesseract,
          which is NOT installed here, so it warns and yields empty text. Stage 5
          is the only route for this document.
        - stage 5 handles it anyway: Gemini reads PDF pages with native vision, so
          a scan needs no OCR and costs the same ~258 tokens per page as a digital
          PDF. The whole charter is roughly 98,000 input tokens.
        - the file is under Gemini's 50 MB / 1000-page ceiling, but stage 5 still
          slices and uploads per chunk so a page is never billed twice.
      Structural proxy for Limay, whose own charter has never been reachable
      (GAP-001 / GAP-003 / GAP-017). ORION'S FEES AND PROCESSING TIMES ARE ORION'S
      FACTS. The process transfers to Limay; the numbers do not. Records publish
      with providerScope "peer-lgu-reference" and a visible badge.

